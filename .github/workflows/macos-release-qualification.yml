name: macOS Release Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_notarization:
        description: Build with Developer ID and submit to Apple notarization
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-release-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-universal:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'chore/macos-release-qualification'
    runs-on: macos-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot 2026-08-05
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run release:check
      - name: Build universal production app and DMG with ad-hoc signing
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
      - name: Locate bundles
        run: |
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          test -n "$DMG_PATH" && test -f "$DMG_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
      - name: Verify generated app identity and architecture
        run: bash scripts/verify-macos-bundle.sh "$APP_PATH" adhoc
      - name: Verify DMG contents
        run: |
          MOUNT="$RUNNER_TEMP/cheat-dock-dmg"
          mkdir -p "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT"
          DMG_APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$DMG_APP" && test -d "$DMG_APP"
          test -e "$MOUNT/Applications"
          bash scripts/verify-macos-bundle.sh "$DMG_APP" adhoc
          hdiutil detach "$MOUNT"
          trap - EXIT
      - name: Record candidate checksums
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Cheat-Dock.app.zip"
          shasum -a 256 "$DMG_PATH" "$RUNNER_TEMP/Cheat-Dock.app.zip" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cheat-dock-v0.1-candidate-universal-adhoc
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.DMG_PATH }}
            ${{ runner.temp }}/Cheat-Dock.app.zip
            ${{ runner.temp }}/SHA256SUMS.txt

  signed-notarized-universal:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_notarization
    runs-on: macos-latest
    environment: macos-release
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot 2026-08-05
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Require release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_P8_BASE64"
      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run release:check
      - name: Build, Developer ID sign, notarize, and staple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
      - name: Remove App Store Connect API key
        if: always()
        run: |
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
      - name: Locate signed bundles
        run: |
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          test -n "$DMG_PATH" && test -f "$DMG_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
      - name: Verify Developer ID app and notarization ticket
        run: bash scripts/verify-macos-bundle.sh "$APP_PATH" developer-id
      - name: Verify signed DMG and installed app payload
        run: |
          codesign --verify --verbose=2 "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          MOUNT="$RUNNER_TEMP/cheat-dock-signed-dmg"
          mkdir -p "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT"
          DMG_APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
          bash scripts/verify-macos-bundle.sh "$DMG_APP" developer-id
          hdiutil detach "$MOUNT"
          trap - EXIT
      - name: Record signed candidate checksums
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Cheat-Dock.notarized.app.zip"
          shasum -a 256 "$DMG_PATH" "$RUNNER_TEMP/Cheat-Dock.notarized.app.zip" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cheat-dock-v0.1-candidate-universal-notarized
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.DMG_PATH }}
            ${{ runner.temp }}/Cheat-Dock.notarized.app.zip
            ${{ runner.temp }}/SHA256SUMS.txt
