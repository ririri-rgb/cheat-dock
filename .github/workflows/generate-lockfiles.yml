name: Generate lockfiles

on:
  push:
    branches: [feat/phase-1-foundation]

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate npm lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - name: Generate Cargo lockfile
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi
      - name: Commit generated lockfiles
        run: |
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already present and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock dependency graph"
          git push origin HEAD:feat/phase-1-foundation
